[workspace]
default-members = ["crates/cli"]
members = ["crates/*", "examples/*", "vendor/superconsole"]
exclude = ["vendor/wasmtime", "vendor/extism-openbsd", "vendor/wasmtime-wasi-openbsd", "examples/sccache", "examples/hash-clojurescript", "examples/buildx"]
resolver = "2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace.dependencies]
extism = "=1.41.0"
extism-pdk = "=1.4.1"

# Rendering only: keyboard events pull in unnecessary OS pollers.
crossterm = { version = "0.29.0", default-features = false, features = ["windows"] }
superconsole = { package = "fluentci-superconsole", path = "vendor/superconsole", version = "=0.3.1" }

[patch.crates-io]
wasmtime = { path = "vendor/wasmtime" }
