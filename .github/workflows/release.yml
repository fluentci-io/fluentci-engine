name: release
on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to rebuild and upload Linux assets for'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        target:
          - aarch64-unknown-linux-gnu
          - x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify cache snapshot export using temporary data
        run: python3 .github/scripts/test-rust-cache-snapshot.py -v
      - name: Cache container Rust compiler results and Cargo downloads
        uses: actions/cache@3edfce9056124e459a23f683a21433670d47daca
        with:
          path: .ci-cache/linux-release
          key: container-rust-v1-${{ matrix.target }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.fluentci/src/jobs.ts', '.fluentci/src/helpers.ts', '.github/scripts/snapshot-rust-cache.sh') }}-${{ hashFiles('crates/**/*.rs', 'vendor/**/*.rs', 'vendor/**/Cargo.toml') }}
          restore-keys: |
            container-rust-v1-${{ matrix.target }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.fluentci/src/jobs.ts', '.fluentci/src/helpers.ts', '.github/scripts/snapshot-rust-cache.sh') }}-
            container-rust-v1-${{ matrix.target }}-
      - name: Prepare compiler-cache transfer directory
        run: mkdir -p .ci-cache/linux-release
      - uses: fluentci-io/setup-fluentci@v5
        with:
          engine-version: 0.4.12
      - name: Select existing release
        env:
          RELEASE_VERSION: ${{ github.event.release.tag_name || inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_VERSION" >/dev/null
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
      - name: Build
        run: |
          fluentci run . build
          ls -ltr
        env:
          TAG: ${{ env.RELEASE_VERSION }}
          TARGET: ${{ matrix.target }}
          FLUENTCI_RUST_CACHE_DIR: .ci-cache/linux-release
          DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}
      - name: Upload release assets
        env:
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
          TARGET: ${{ matrix.target }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_VERSION" \
            "fluentci-engine_${RELEASE_VERSION}_${TARGET}.tar.gz" \
            "fluentci-engine_${RELEASE_VERSION}_${TARGET}.tar.gz.sha256" --clobber
