name: Linux releases
on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild and upload Linux assets for
        required: true
        type: string
permissions:
  contents: write
jobs:
  modules:
    name: Compile portable PureScript release module
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: fluentci-io/setup-fluentci@next
      - uses: ./.github/actions/fluentci-modules
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release-module
          path: .fluentci/release/dist/plugin.wasm
          if-no-files-found: error
          include-hidden-files: true
  build:
    needs: modules
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    env:
      TARGET: ${{ matrix.target }}
      RELEASE_VERSION: ${{ github.event.release.tag_name || inputs.tag }}
      RELEASE_MODULE: .fluentci/release/dist/plugin.wasm
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: fluentci-io/setup-fluentci@next
      - uses: actions/download-artifact@v4
        with:
          name: linux-release-module
          path: .fluentci/release/dist
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: '1.99.1'
          targets: ${{ matrix.target }}
      - uses: ./.github/actions/rust-cache
        with:
          key: release-${{ matrix.target }}
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config protobuf-compiler
      - name: Select existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$RELEASE_VERSION" >/dev/null
      - name: Build release with PureScript
        run: fluentci --check-update=false run --wasm "$RELEASE_MODULE" build
      - name: Package release with PureScript
        run: fluentci --check-update=false run --wasm "$RELEASE_MODULE" package
      - name: Upload release with PureScript
        env:
          GH_TOKEN: ${{ github.token }}
        run: fluentci --check-update=false run --wasm "$RELEASE_MODULE" upload
