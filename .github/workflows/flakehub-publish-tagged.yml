name: "Publish tags to FlakeHub"
on:
  push:
    tags:
      - "v?[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      tag:
        description: "The existing tag to publish to FlakeHub"
        type: "string"
        required: true
jobs:
  flakehub-publish:
    runs-on: "ubuntu-22.04"
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    permissions:
      id-token: "write"
      contents: "read"
    steps:
      - uses: "actions/checkout@v4"
        with:
          ref: "${{ (inputs.tag != null) && format('refs/tags/{0}', inputs.tag) || '' }}"
          fetch-depth: 0
      - uses: fluentci-io/setup-fluentci@next
        with:
          version: v0.17.3
      - name: Set up Determinate Nix through FluentCI
        run: |
          fluentci --check-update=false run setup-determinate-nix@0.2.2 setup --sudo --trusted-users "$(id -un)"
          echo /nix/var/nix/profiles/default/bin >> "$GITHUB_PATH"
      - name: Set up FlakeHub publisher through FluentCI
        run: |
          fluentci --check-update=false run setup-flakehub-push@v0.2.0 setup --install-dir "$RUNNER_TEMP/flakehub-push"
          echo "$RUNNER_TEMP/flakehub-push/bin" >> "$GITHUB_PATH"
      - name: Publish tagged flake through FluentCI
        env:
          RELEASE_VERSION: ${{ inputs.tag || github.ref_name }}
          FLAKEHUB_PUSH_GITHUB_TOKEN: ${{ github.token }}
          NIX_CONFIG: |
            access-tokens = github.com=${{ github.token }}
        run: |
          export FLAKEHUB_PUSH_REV="$(git rev-parse HEAD)"
          fluentci --check-update=false run nix-publish@v0.2.0 flakehub \
            --run-dir "$RUNNER_TEMP/flakehub-$GITHUB_RUN_ATTEMPT" \
            --name "$GITHUB_REPOSITORY" \
            --version "$RELEASE_VERSION" \
            --visibility public \
            --timeout-ms 2400000
