name: "Publish a flake to flakestry"
on:
  push:
    tags:
      - "v?[0-9]+.[0-9]+.[0-9]+"
      - "v?[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "The existing tag to publish"
        type: "string"
        required: true
jobs:
  publish-flake:
    runs-on: ubuntu-24.04
    permissions:
      id-token: "write"
      contents: "read"
    steps:
      - uses: actions/checkout@v4
      - uses: fluentci-io/setup-fluentci@next
        with:
          version: '2026.11.04'
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: ./.github/actions/fluentci-modules
      - name: Install publication utilities
        run: nix profile install nixpkgs#jo nixpkgs#jq
      - name: Publish through the PureScript Nix module
        run: fluentci --check-update=false run nix flakestry
        env:
          VERSION: ${{ inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.sha }}
