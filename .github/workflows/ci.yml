name: ci
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          set-safe-directory: false
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          # this might remove tools that are actually needed,
          # if set to "true" but frees about 6 GB
          tool-cache: false

          # all of these default to true, but feel free to set to
          # "false" if necessary for your workflow
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      - name: Verify OS-provided curl before native provisioning
        env:
          PATH: /usr/bin:/bin:/usr/sbin:/sbin:/usr/local/bin
        run: |
          test "$(command -v curl)" = /usr/bin/curl
          /usr/bin/curl --version
      - name: Install native Flox
        uses: flox/install-flox-action@61d86f71ca9fc8061fea04e5bc5e3a8206423dca
        env:
          # Avoid curl binaries injected by legacy build-tool environments.
          PATH: /usr/bin:/bin:/usr/sbin:/sbin:/usr/local/bin
        with:
          version: '1.19.3'
          disable-metrics: 'true'
      - name: Verify native Flox
        env:
          PATH: /usr/bin:/bin:/usr/sbin:/sbin:/usr/local/bin
        run: flox --version
      - name: Setup Fluent CI
        uses: fluentci-io/setup-fluentci@v5
        with:
          wasm: true
          engine-version: 0.5.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: '1.99.1'
          targets: wasm32-unknown-unknown
      - uses: ./.github/actions/rust-cache
        with:
          key: legacy-ci-ubuntu-24.04
      - name: Build release engine
        run: cargo build --release --locked -p fluentci-engine
      - name: Run Build and e2e tests
        run: |
          export PATH="$HOME/.cargo/bin:$HOME/.local/bin:$PATH"
          ls -ltr ../target
          install -d "$HOME/.local/bin"
          install -m 755 ../target/release/fluentci-engine "$HOME/.local/bin/fluentci-engine"
          "$HOME/.local/bin/fluentci-engine" --version
          fluentci-engine run -- deno run -A ../.fluentci/e2e.ts
        working-directory: fixtures
        env:
          FLOX_FLOXHUB_TOKEN: ${{ secrets.FLOX_HUB_TOKEN }}
          FLOX_DISABLE_METRICS: 'true'
          FLUENTCI_CACHE_CDN_ENDPOINT: https://cache.fluentci.io
          FLUENTCI_CACHE_S3_ENDPOINT: https://fe5b1e2ce9f94f4c0415ab94ce402012.r2.cloudflarestorage.com
          FLUENTCI_CACHE_S3_BUCKET: cache
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          HONEYCOMB_API_KEY: ${{ secrets.HONEYCOMB_API_KEY }}
          HONEYCOMB_DATASET: fluentci-engine
          OTEL_EXPORTER_OTLP_ENDPOINT: https://api.honeycomb.io
          BASELIME_API_KEY: ${{ secrets.BASELIME_API_KEY }}

  publish:
    needs: tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v1
        with:
          deno-version: v1.41
      - name: Publish package
        run: deno publish --allow-slow-types
        working-directory: ./sdk/typescript
