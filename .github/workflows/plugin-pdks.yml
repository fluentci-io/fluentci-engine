name: Plugin PDKs

on:
  push:
    branches: [main]
    paths: ['examples/hash-clojurescript/**', 'examples/sccache/**', 'tests/e2e_sccache.py', 'sdk/**', 'schema/**', 'scripts/xtp_codegen.py', 'scripts/clojurescript_codegen.py', 'fixtures/matrix-demo/**', 'tests/e2e_matrix.py', 'tests/e2e_workflow.py', 'tests/e2e_guest_pdks.py', 'tests/e2e_files.py', 'tests/files.test.mjs', 'tests/guest_pdks.test.mjs', '.github/workflows/plugin-pdks.yml', '.github/scripts/setup-plugin-pdks.sh', 'crates/**', 'Cargo.*']
  pull_request:
    paths: ['examples/hash-clojurescript/**', 'examples/sccache/**', 'tests/e2e_sccache.py', 'sdk/**', 'schema/**', 'scripts/xtp_codegen.py', 'scripts/clojurescript_codegen.py', 'fixtures/matrix-demo/**', 'tests/e2e_matrix.py', 'tests/e2e_workflow.py', 'tests/e2e_guest_pdks.py', 'tests/e2e_files.py', 'tests/files.test.mjs', 'tests/guest_pdks.test.mjs', '.github/workflows/plugin-pdks.yml', '.github/scripts/setup-plugin-pdks.sh', 'crates/**', 'Cargo.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugin-pdks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guests:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: fluentci-io/setup-fluentci@next
        with:
          version: '2026.11.04'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: '1.99.1'
          targets: wasm32-unknown-unknown
      - uses: ./.github/actions/rust-cache
        with:
          key: host-ubuntu-24.04
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '26'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          working_directory: sdk/clojurescript
          install_args: clojure
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: '0.13.7'
          enable-cache: true
          cache-dependency-glob: sdk/python/uv.lock
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          otp-version: '29.1.2'
          elixir-version: '1.20.4'
          gleam-version: '1.19.2'
          version-type: strict
      - name: Install checksum-pinned guest compilers
        run: bash .github/scripts/setup-plugin-pdks.sh
      - name: Check canonical ABI and immutable guest primitives
        run: |
          python3 scripts/xtp_codegen.py --check
          node --test tests/guest_pdks.test.mjs tests/matrix.test.mjs tests/workflow.test.mjs tests/files.test.mjs
      - name: Typecheck, test, and compile Python guest
        working-directory: sdk/python
        run: |
          uv sync --locked --python 3.12
          uv run mypy
          uv run python -m unittest discover -s tests -v
          uv run fluentci-plugin demo/plugin.py -o dist/plugin.wasm
      - name: Test Elixir DSL and compile its Wasm guest
        run: |
          (cd sdk/elixir && mix format --check-formatted && mix test --warnings-as-errors test/plugin_test.exs test/matrix_test.exs test/host_test.exs)
          cd sdk/elixir/demo-plugin
          mix deps.get
          mix fluentci.plugin.build DemoPlugin --pdk-path ../../../crates/pdk --output dist/plugin.wasm
      - name: Compile Gleam guest to Wasm
        working-directory: sdk/gleam/demo-plugin
        run: npm ci && npm run build
      - name: Compile ReScript 12 guest to Wasm
        run: |
          (cd sdk/rescript && npm ci && npm run res:build)
          (cd sdk/rescript/demo-plugin && npm ci && npm run build)
      - name: Compile PureScript guest to Wasm
        working-directory: sdk/purescript/demo-plugin
        run: |
          npm install --global purescript@0.15.16 spago@1.0.5
          npm ci
          npm run build
      - name: Typecheck, test, and compile ClojureScript guest to Wasm
        working-directory: sdk/clojurescript
        run: |
          mise exec -- clojure -M:test
          node build/tests.cjs
          cd demo-plugin
          npm ci
          mise exec -- npm run build
      - name: Compile and test the PureScript sccache example
        working-directory: examples/sccache
        run: npm ci && npm run build && npm test
      - name: Compile the ClojureScript hash plugin
        working-directory: examples/hash-clojurescript
        run: mise trust && npm ci && mise exec -- npm run build
      - name: Compile TypeScript guest to Wasm
        working-directory: sdk/typescript/demo-plugin
        run: npm ci && npm run build
      - name: Build release engine and invoke every guest
        run: |
          cargo build --release --locked -p fluentci-engine
          python3 tests/e2e_server.py RunServer.test_named_artifact_download_is_authenticated_and_recovery_keeps_optional_outcomes RunServer.test_remote_watch_preserves_failed_process_code_and_message -v
          python3 tests/e2e_host.py HostExecution.test_process_error_and_exit_code_reach_cli_events_and_saved_watch HostExecution.test_failure_exit_code_and_skipped_dependency HostExecution.test_signal_failure_and_timeout_report_explicit_exit_codes HostExecution.test_tui_keeps_failure_reason_after_output_tail_rolls_over HostExecution.test_tui_keeps_process_error_and_exit_code_after_output_tail_rolls_over -v
          python3 tests/e2e_provider_worker.py -v
          python3 tests/e2e_guest_pdks.py -v
          python3 tests/e2e_matrix.py -v
          python3 tests/e2e_workflow.py -v
          python3 tests/e2e_files.py -v
          python3 tests/e2e_sccache.py -v
      - name: Preserve compiled guests and generated entry source
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: plugin-pdks
          path: |
            sdk/*/demo-plugin/dist/
            sdk/python/dist/
            examples/sccache/dist/
            examples/hash-clojurescript/dist/
          if-no-files-found: ignore
          retention-days: 7
