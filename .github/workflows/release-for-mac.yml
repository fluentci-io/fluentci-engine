name: macOS releases

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to rebuild and upload macOS assets for'
        required: true
        type: string

permissions:
  contents: write

jobs:
  modules:
    name: Compile portable PureScript release module
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: fluentci-io/setup-fluentci@next
      - uses: ./.github/actions/fluentci-modules
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release-module
          path: .fluentci/release/dist/plugin.wasm
          if-no-files-found: error
          include-hidden-files: true
  release:
    needs: modules
    name: release ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin

    env:
      RELEASE_MODULE: .fluentci/release/dist/plugin.wasm
    steps:
      - name: Checking out sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: fluentci-io/setup-fluentci@next
      - uses: actions/download-artifact@v4
        with:
          name: macos-release-module
          path: .fluentci/release/dist
      - name: Select existing release
        env:
          RELEASE_VERSION: ${{ github.event.release.tag_name || inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_VERSION" >/dev/null
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
      - name: Install native build and upload dependencies
        run: |
          set -euo pipefail
          brew install protobuf
          if ! command -v aws >/dev/null 2>&1; then
            brew install awscli
          fi
          aws --version
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: '1.99.1'
          targets: ${{ matrix.target }}
      - uses: ./.github/actions/rust-cache
        with:
          key: release-${{ matrix.os }}-${{ matrix.target }}
      - name: Build cached release binary
        env:
          TARGET: ${{ matrix.target }}
        run: fluentci --check-update=false run --wasm "$RELEASE_MODULE" build
      - name: Package final binary with macOS tools
        env:
          TARGET: ${{ matrix.target }}
        run: fluentci --check-update=false run --wasm "$RELEASE_MODULE" package
      - name: Upload release assets
        env:
          TARGET: ${{ matrix.target }}
          GH_TOKEN: ${{ github.token }}
        run: fluentci --check-update=false run --wasm "$RELEASE_MODULE" upload
      - name: Upload assets to Cloudflare R2
        env:
          TARGET: ${{ matrix.target }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          ACCOUNT_ID: fe5b1e2ce9f94f4c0415ab94ce402012
        run: fluentci --check-update=false run --wasm "$RELEASE_MODULE" r2
