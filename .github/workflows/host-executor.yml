name: Host executor

on:
  pull_request:
    paths:
      - 'crates/**'
      - 'vendor/**'
      - 'Cargo.*'
      - 'tests/**'
      - 'examples/**'
      - 'schema/**'
      - 'scripts/xtp_codegen.py'
      - 'sdk/**'
      - 'sdk/elixir/**'
      - '.github/workflows/host-executor.yml'
      - '.github/actions/rust-cache/**'
      - '.github/scripts/**'
      - 'rust-toolchain.toml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: host-executor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: Executor and CLI (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # pinned action; toolchain selected below
        with:
          toolchain: '1.99.1'
          components: clippy,rustfmt
          targets: wasm32-unknown-unknown
      - uses: ./.github/actions/rust-cache
        with:
          key: host-${{ matrix.os }}
      - name: Executor, cache, server lifecycle, and legacy regression tests
        run: cargo test --release --locked -p fluentci-executor -p fluentci-core -p fluentci-server --lib --tests
      - name: Require native workspace clones on APFS
        if: runner.os == 'macOS'
        env:
          FLUENTCI_REQUIRE_WORKSPACE_CLONE: '1'
        run: cargo test --release --locked -p fluentci-executor workspace_copy::tests::native_and_fallback_copies_preserve_bytes_modes_and_independent_writes
      - name: Package-manager fixture tests (no installation)
        run: |
          cargo test --release --locked -p fluentci-ext --lib homebrew
          cargo test --release --locked -p fluentci-ext --lib macports
          cargo test --release --locked -p fluentci-ext --lib bsd
          cargo test --release --locked -p fluentci-ext --lib console
          cargo test --release --locked -p fluentci-ext --lib envhub
          cargo test --release --locked -p fluentci-superconsole --lib
      - name: Native Homebrew package plan (supported hosts only)
        if: matrix.os != 'macos-15-intel'
        shell: bash
        run: |
          set -eu
          if [ "$(uname -s)" = Darwin ]; then
            brew_binary=/opt/homebrew/bin/brew
          else
            brew_binary=/home/linuxbrew/.linuxbrew/bin/brew
          fi
          if [ ! -x "$brew_binary" ]; then
            /usr/bin/curl -fsSL https://raw.githubusercontent.com/Homebrew/install/8c82c081753d4263da0cfe615ef8d9433425f22b/install.sh -o "$RUNNER_TEMP/homebrew-install.sh"
            NONINTERACTIVE=1 /bin/bash "$RUNNER_TEMP/homebrew-install.sh"
          fi
          cargo test --release --locked -p fluentci-executor --test packages native_package_plan_install -- --ignored --exact
      - name: Executor lint
        run: cargo clippy --release --locked -p fluentci-executor --all-targets -- -D warnings
      - name: Build CLI and run end-to-end tests
        env:
          FLUENTCI_E2E_ARTIFACTS: .ci-artifacts/host-e2e
        run: |
          cargo build --release --locked -p fluentci-engine
          python3 tests/e2e_host.py -v
          python3 tests/e2e_server.py -v
      - name: Preserve failed native service diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-host-e2e-${{ matrix.os }}
          path: .ci-artifacts/host-e2e
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Compile and exercise legacy and XTP-generated Wasm plugins
        run: |
          python3 scripts/xtp_codegen.py --check
          cargo build --release --locked --target wasm32-unknown-unknown -p env -p hash -p archive -p chmod -p devbox -p flox -p git -p hermit -p http -p mise -p module -p nix -p pixi -p pkgx -p proto -p vault -p xtp-smoke
          python3 tests/e2e_wasm.py -v

      - name: Set up Gleam for JavaScript host plans
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: 'false'
          gleam-version: '1.19.2'
          version-type: strict
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26'
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: '2.9.7'
      - name: Validate XTP schemas with the official parser
        run: deno task --config schema/deno.json check
      - name: Gleam host contracts against the release engine (Node and Deno)
        working-directory: sdk/gleam
        env:
          FLUENTCI_ENGINE_BIN: ${{ github.workspace }}/target/release/fluentci-engine
          FLUENTCI_REQUIRE_ENGINE: '1'
        run: |
          gleam format --check src/fluentci/host.gleam src/fluentci/host/local.gleam src/fluentci/host/result.gleam src/fluentci/host/client.gleam src/fluentci/host/journal.gleam test/host_test.gleam test/host_local_test.gleam test/host_client_test.gleam test/host_journal_test.gleam
          gleam test --runtime nodejs
          gleam test --runtime deno

      - name: Check TypeScript SDK and demo
        if: matrix.os == 'ubuntu-24.04'
        working-directory: sdk/typescript
        run: deno task check
      - name: Compile PureScript SDK examples
        if: matrix.os == 'ubuntu-24.04'
        run: |
          npm install --global purescript@0.15.16 spago@1.0.5
          for example in demo demo-dagger demo-host; do
            (cd "sdk/purescript/$example" && spago build)
          done
          python3 tests/e2e_purescript.py
      - name: Build the local Gleam demo
        if: matrix.os == 'ubuntu-24.04'
        working-directory: sdk/gleam/demo
        run: gleam build

      - name: Compile ReScript SDK and local demo
        if: matrix.os == 'ubuntu-24.04'
        run: |
          npm install --global bun@1.4.3
          (cd sdk/rescript && bun install --frozen-lockfile && bun run res:build)
          (cd sdk/rescript/demo && bun install --frozen-lockfile && bun run res:build)
      - name: Bundle local TypeScript plugin examples
        if: matrix.os == 'ubuntu-24.04'
        working-directory: sdk/typescript/demo-ext
        run: bun install --frozen-lockfile && node esbuild.js

      - name: Set up Elixir host plan contracts
        if: matrix.os == 'ubuntu-24.04'
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: '29.1.2'
          elixir-version: '1.20.4'
          version-type: strict
      - name: Elixir host contracts against the release engine
        if: matrix.os == 'ubuntu-24.04'
        working-directory: sdk/elixir
        env:
          FLUENTCI_ENGINE_BIN: ${{ github.workspace }}/target/release/fluentci-engine
          FLUENTCI_REQUIRE_ENGINE: '1'
        run: |
          mix format --check-formatted
          mix test --warnings-as-errors

  macports:
    name: Native MacPorts (${{ matrix.os }}, ${{ matrix.backend }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
        backend: [native, rust]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # pinned action; toolchain selected below
        with:
          toolchain: '1.99.1'
      - uses: ./.github/actions/rust-cache
        with:
          key: macports-${{ matrix.os }}-${{ matrix.backend }}
      - name: Cache MacPorts binary installers
        uses: actions/cache@3edfce9056124e459a23f683a21433670d47daca
        with:
          path: .ci-cache/macports-installers
          key: macports-cli-v1-2.12.7-rs-0.1.3-${{ matrix.os }}-${{ matrix.backend }}
      - name: Install official MacPorts binary package
        run: |
          set -euo pipefail
          test "$(/usr/bin/sw_vers -productVersion | cut -d. -f1)" = 15
          test ! -e /opt/local/bin/jq
          package_dir="$GITHUB_WORKSPACE/.ci-cache/macports-installers"
          mkdir -p "$package_dir"
          package="$package_dir/MacPorts-2.12.7-15-Sequoia.pkg"
          if [ ! -f "$package" ]; then
            /usr/bin/curl --fail --location --proto '=https' --proto-redir '=https' --retry 3 --output "$package" https://github.com/macports/macports-base/releases/download/v2.12.7/MacPorts-2.12.7-15-Sequoia.pkg
          fi
          printf '%s  %s\n' 87b2e87ed7adc4aca947b42eb7ff991614cc0edfccb486237f2bbc75f28aae63 "$package" | shasum -a 256 --check
          # Seed before installation: its postflight synchronizes the ports tree.
          sudo -n mkdir -p /opt/local/etc/macports
          printf '%s\n' 'https://distfiles.macports.org/ports.tar.gz [default]' | sudo -n tee /opt/local/etc/macports/sources.conf
          sudo -n /usr/sbin/installer -pkg "$package" -target /
          /opt/local/bin/port version
      - name: Synchronize and verify the native MacPorts catalog as the install user
        run: sudo -n env HOME=/var/root /bin/sh .github/scripts/prepare-macports-catalog.sh
      - name: Install pinned Rust backend binary
        if: matrix.backend == 'rust'
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            arm64) target=aarch64-apple-darwin; checksum=eed753409b5150dd0a9dffe60b2179a95497ff1bf6e13815565eb2ceee62ba40 ;;
            x86_64) target=x86_64-apple-darwin; checksum=904e4397e3bba92302fd155f490fb22927185e7b0a76950acf8b4ec65a6e6725 ;;
            *) echo "No pinned macports-rs binary for this architecture" >&2; exit 1 ;;
          esac
          package_dir="$GITHUB_WORKSPACE/.ci-cache/macports-installers"
          archive="$package_dir/port-$target.tar.gz"
          if [ ! -f "$archive" ]; then
            /usr/bin/curl --fail --location --proto '=https' --proto-redir '=https' --retry 3 --output "$archive" "https://github.com/tsirysndr/macports-rs/releases/download/v0.1.3/port-$target.tar.gz"
          fi
          printf '%s  %s\n' "$checksum" "$archive" | shasum -a 256 --check
          extract=$(mktemp -d "$RUNNER_TEMP/macports-rs.XXXXXX")
          tar -xzf "$archive" -C "$extract"
          sudo -n install -d /usr/local/bin
          sudo -n install -m 755 "$extract/port" /usr/local/bin/port
          /usr/local/bin/port version
      - name: Verify jq lookup through the selected backend before building tests
        env:
          MACPORTS_BACKEND: ${{ matrix.backend }}
        run: |
          set -euo pipefail
          case "$MACPORTS_BACKEND" in
            native) binary=/opt/local/bin/port ;;
            rust) binary=/usr/local/bin/port ;;
            *) echo 'Unknown MacPorts backend' >&2; exit 1 ;;
          esac
          sudo -n env HOME=/var/root "$binary" -q info jq
      - name: Build release native-install tests without elevation
        run: |
          set -euo pipefail
          cargo test --release --locked -p fluentci-executor --test packages --no-run --message-format=json > "$RUNNER_TEMP/executor-tests.json"
          cargo test --release --locked -p fluentci-ext --test native_packages --no-run --message-format=json > "$RUNNER_TEMP/extension-tests.json"
      - name: Install through selected backend and verify provider PATH
        env:
          MACPORTS_BACKEND: ${{ matrix.backend }}
        run: |
          set -euo pipefail
          test ! -e /opt/local/bin/jq
          executor_test=$(python3 -c 'import json,sys; rows=[json.loads(s) for s in open(sys.argv[1])]; bins=[r["executable"] for r in rows if r.get("reason")=="compiler-artifact" and r.get("executable") and r["target"]["name"]=="packages"]; assert len(bins)==1, bins; print(bins[0])' "$RUNNER_TEMP/executor-tests.json")
          extension_test=$(python3 -c 'import json,sys; rows=[json.loads(s) for s in open(sys.argv[1])]; bins=[r["executable"] for r in rows if r.get("reason")=="compiler-artifact" and r.get("executable") and r["target"]["name"]=="native_packages"]; assert len(bins)==1, bins; print(bins[0])' "$RUNNER_TEMP/extension-tests.json")
          sudo -n env HOME=/var/root FLUENTCI_TEST_PACKAGE_MANAGER=macports FLUENTCI_TEST_MACPORTS_BACKEND="$MACPORTS_BACKEND" "$executor_test" native_package_plan_install --ignored --exact --nocapture
          sudo -n env HOME=/var/root FLUENTCI_TEST_MACPORTS_BACKEND="$MACPORTS_BACKEND" "$extension_test" native_macports_package_install --ignored --exact --nocapture
          /opt/local/bin/jq --version

  freebsd:
    name: Native FreeBSD executor and pkg
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Restore native freebsd Rust caches
        uses: actions/cache@3edfce9056124e459a23f683a21433670d47daca
        with:
          path: .ci-cache/bsd-rust
          key: bsd-rust-v1-freebsd-14.3-x86_64-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'crates/**/Cargo.toml') }}-${{ hashFiles('crates/**/*.rs', 'vendor/**/*.rs', 'vendor/**/Cargo.toml') }}
          restore-keys: |
            bsd-rust-v1-freebsd-14.3-x86_64-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'crates/**/Cargo.toml') }}-
            bsd-rust-v1-freebsd-14.3-x86_64-
      - uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1
        with:
          release: '14.3'
          arch: x86_64
          mem: 8192
          cpu: 2
          copyback: true
          prepare: |
            set -eu
            pkg install -y rust git pkgconf
          run: |
            set -eu
            . .github/scripts/bsd-rust-cache.sh
            export CARGO_BUILD_JOBS=2
            uname -a
            rustc --version
            cargo test --release --locked -p fluentci-executor
            cargo test --release --locked -p fluentci-ext --lib bsd
            cargo test --release --locked -p fluentci-ext --lib console
            cargo test --release --locked -p fluentci-superconsole --lib
            cargo test --release --locked -p fluentci-ext --test native_packages native_bsd_package_install -- --ignored --exact
            cargo test --release --locked -p fluentci-executor --test packages native_package_plan_install -- --ignored --exact

  netbsd:
    name: Native NetBSD executor and pkgin
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Restore native netbsd Rust caches
        uses: actions/cache@3edfce9056124e459a23f683a21433670d47daca
        with:
          path: .ci-cache/bsd-rust
          key: bsd-rust-v1-netbsd-10.1-x86_64-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'crates/**/Cargo.toml') }}-${{ hashFiles('crates/**/*.rs', 'vendor/**/*.rs', 'vendor/**/Cargo.toml') }}
          restore-keys: |
            bsd-rust-v1-netbsd-10.1-x86_64-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'crates/**/Cargo.toml') }}-
            bsd-rust-v1-netbsd-10.1-x86_64-
      - uses: vmactions/netbsd-vm@c8a0d7ddb84619a7a8cc4e652efa7950b3fd9f92 # v1
        with:
          release: '10.1'
          arch: x86_64
          mem: 8192
          cpu: 2
          copyback: true
          prepare: |
            set -eu
            export PATH=/usr/pkg/bin:/usr/pkg/sbin:/usr/bin:/usr/sbin:/bin:/sbin
            # The base VM has pkg_add, but does not preinstall pkgin.
            if [ ! -x /usr/pkg/bin/pkgin ]; then
              /usr/sbin/pkg_add pkgin
            fi
            # Use the same live mirrors selected by the action's onStarted hook.
            repositories=$(sed -n 's/^PKG_PATH=//p' /etc/pkg_install.conf)
            if [ -z "$repositories" ]; then
              echo "NetBSD VM did not configure a package repository" >&2
              exit 1
            fi
            printf '%s\n' "$repositories" | tr ';' '\n' > /usr/pkg/etc/pkgin/repositories.conf
            /usr/pkg/bin/pkgin -y update
            /usr/pkg/bin/pkgin -y install rust git pkgconf
          run: |
            set -eu
            export PATH=/usr/pkg/bin:/usr/pkg/sbin:$PATH
            . .github/scripts/bsd-rust-cache.sh
            export CARGO_BUILD_JOBS=2
            uname -a
            rustc --version
            cargo test --release --locked -p fluentci-executor
            cargo test --release --locked -p fluentci-ext --lib bsd
            cargo test --release --locked -p fluentci-ext --lib console
            cargo test --release --locked -p fluentci-superconsole --lib
            cargo test --release --locked -p fluentci-ext --test native_packages native_bsd_package_install -- --ignored --exact
            cargo test --release --locked -p fluentci-executor --test packages native_package_plan_install -- --ignored --exact

  openbsd:
    name: Native OpenBSD executor and pkg_add
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Restore native openbsd Rust caches
        uses: actions/cache@3edfce9056124e459a23f683a21433670d47daca
        with:
          path: .ci-cache/bsd-rust
          key: bsd-rust-v1-openbsd-7.8-x86_64-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'crates/**/Cargo.toml') }}-${{ hashFiles('crates/**/*.rs', 'vendor/**/*.rs', 'vendor/**/Cargo.toml') }}
          restore-keys: |
            bsd-rust-v1-openbsd-7.8-x86_64-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'crates/**/Cargo.toml') }}-
            bsd-rust-v1-openbsd-7.8-x86_64-
      - uses: vmactions/openbsd-vm@f1ca8bc8ecc5b6ef7218e5b914836e067e1546d3 # v1
        with:
          release: '7.8'
          arch: x86_64
          mem: 8192
          cpu: 2
          copyback: true
          prepare: |
            set -eu
            pkg_add -I rust git pkgconf
          run: |
            set -eu
            export PATH=/usr/local/bin:/usr/local/sbin:$PATH
            . .github/scripts/bsd-rust-cache.sh
            export CARGO_BUILD_JOBS=2
            uname -a
            rustc --version
            cargo test --release --locked -p fluentci-executor
            cargo test --release --locked -p fluentci-ext --lib bsd
            cargo test --release --locked -p fluentci-ext --lib console
            cargo test --release --locked -p fluentci-superconsole --lib
            cargo test --release --locked -p fluentci-ext --test native_packages native_bsd_package_install -- --ignored --exact
            cargo test --release --locked -p fluentci-executor --test packages native_package_plan_install -- --ignored --exact

  flox-bootstrap:
    name: Native Flox automatic provisioning
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: '1.99.1'
      - uses: ./.github/actions/rust-cache
        with:
          key: flox-bootstrap-ubuntu-24.04
      - name: Bootstrap Flox and activate jq through the extension
        env:
          FLOX_VERSION: '1.19.3'
          FLOX_FLOXHUB_TOKEN: ${{ secrets.FLOX_HUB_TOKEN }}
          FLOX_DISABLE_METRICS: 'true'
          FLUENTCI_REQUIRE_FLOX_BOOTSTRAP: '1'
        run: cargo test --release --locked -p fluentci-ext --test native_packages native_flox_auto_provision -- --ignored --exact --nocapture
